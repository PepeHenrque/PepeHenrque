name: Generate Stats & Snake

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (repositórios fixados aparecem em ~10-15 min)
  workflow_dispatch:
  push:
    branches:
      - main

# evita duas execuções ao mesmo tempo tentando salvar o README
concurrency:
  group: perfil
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Custom Stats Card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python scripts/generate_card.py
          mkdir -p dist
          cp github-stats.svg dist/
          python scripts/gerar_visuais.py --out=dist

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: PepeHenrque
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # cobrinha de uma cor e comida de outra (sempre opostas), trocando juntas a cada 4 segundos
      - name: Color the snake
        run: python scripts/colorir_cobrinha.py dist/github-contribution-grid-snake.svg alternado azul

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true

      # Os projetos do README vêm dos repositórios fixados no perfil.
      # Se mudaram, salva o README novo (commits feitos pelo GITHUB_TOKEN não disparam o workflow de novo).
      - name: Update README projects
        run: |
          if git diff --quiet README.md; then
            echo "README sem mudança."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "README: atualiza projetos fixados"
          git pull --rebase
          git push
